name: CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-image:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          # Environment variables created from GitHub Secrets
          DEPLOY_HOST=${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER=${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY=${{ secrets.DEPLOY_SSH_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          API_KEY=${{ secrets.API_KEY }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=${{ secrets.DEBUG || false }}
          EOF
          echo ".env file created successfully"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish-image

    steps:
      - name: Check required secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_USER }}" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Write SSH key with proper formatting
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Check system resources
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h /
          echo "=== Docker info ==="
          docker info --format '{{.DriverStatus}}' 2>/dev/null || true

      - name: Deploy to remote host over SSH
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /tmp/deploy_key
          script: |
            set -e
            mkdir -p ~/aitos
            cd ~/aitos
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git pull
            fi
            
            # Create .env file on deployment server
            cat > .env << 'ENVEOF'
            DEPLOY_HOST=${{ secrets.DEPLOY_HOST }}
            DEPLOY_USER=${{ secrets.DEPLOY_USER }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            API_KEY=${{ secrets.API_KEY }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=${{ secrets.DEBUG || false }}
            ENVEOF
            
            docker login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            # Validate compose config before pulling
            echo "Validating docker-compose configuration..."
            docker compose config > /dev/null || exit 1

            docker compose pull
            docker compose up -d --build

            # Debug: list running containers and their health
            echo "=== Container status after startup ==="
            docker compose ps --all
            echo "=== ClickHouse inspect (first 30 lines) ==="
            docker inspect aitos-clickhouse 2>/dev/null | head -30 || echo "container not found yet"
            echo "========================================"

            # Wait for ClickHouse to become healthy (with logs on failure)
            echo "Waiting for ClickHouse to become healthy..."
            status=""
            for i in $(seq 1 120); do
              status=$(docker inspect --format='{{json .State.Health.Status}}' aitos-clickhouse 2>/dev/null || echo "null")
              echo "[$i/120] clickhouse status: $status"
              if [ "$status" = '"healthy"' ]; then
                echo "ClickHouse is healthy"
                break
              fi
              # Print logs every 30 iterations to debug slow startup
              if [ $((i % 30)) -eq 0 ]; then
                echo "=== ClickHouse logs (iteration $i) ==="
                docker compose logs --tail=50 aitos-clickhouse 2>/dev/null || true
              fi
              sleep 10
            done

            if [ "$status" != '"healthy"' ]; then
              echo "::error::ClickHouse failed to become healthy; printing logs:"
              docker compose logs --no-color --tail=300 aitos-clickhouse || docker logs aitos-clickhouse --tail=300 2>/dev/null || true
              exit 1
            fi
