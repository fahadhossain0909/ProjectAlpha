name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Code Quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint
      - name: Run Black formatter check
        run: black --check .
        continue-on-error: true
      - name: Run isort import checker
        run: isort --check-only .
        continue-on-error: true
      - name: Run Flake8 linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    timeout-minutes: 45
    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: aitos_test
      CLICKHOUSE_PASSWORD: aitos_test_password
      CLICKHOUSE_DATABASE: aitos
      TESTING: 'true'
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.12-alpine
        env:
          CLICKHOUSE_USER: aitos_test
          CLICKHOUSE_PASSWORD: aitos_test_password
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Verify decision_fusion.py immediately after checkout
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          git status --short
          sha256sum aitos/kernel/decision_fusion.py
          git hash-object aitos/kernel/decision_fusion.py
          git show HEAD:aitos/kernel/decision_fusion.py | sha256sum
          python3 -m py_compile aitos/kernel/decision_fusion.py
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Verify decision_fusion.py after setup-python cache restore
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          git status --short
          sha256sum aitos/kernel/decision_fusion.py
          git hash-object aitos/kernel/decision_fusion.py
          git show HEAD:aitos/kernel/decision_fusion.py | sha256sum
          python -m py_compile aitos/kernel/decision_fusion.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov
      - name: Initialize ClickHouse test database
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8123/ping >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --user "$CLICKHOUSE_USER:$CLICKHOUSE_PASSWORD" 'http://127.0.0.1:8123/' --data-binary 'CREATE DATABASE IF NOT EXISTS aitos'
      - name: Verify decision_fusion.py before pytest
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          git status --short
          sha256sum aitos/kernel/decision_fusion.py
          git hash-object aitos/kernel/decision_fusion.py
          git show HEAD:aitos/kernel/decision_fusion.py | sha256sum
          nl -ba aitos/kernel/decision_fusion.py | sed -n '115,150p'
          python -m py_compile aitos/kernel/decision_fusion.py
      - name: Create .env file from secrets for tests
        run: |
          cat > .env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          API_KEY=${{ secrets.API_KEY }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=true
          TESTING=true
          CLICKHOUSE_HOST=$CLICKHOUSE_HOST
          CLICKHOUSE_PORT=$CLICKHOUSE_PORT
          CLICKHOUSE_USER=$CLICKHOUSE_USER
          CLICKHOUSE_PASSWORD=$CLICKHOUSE_PASSWORD
          CLICKHOUSE_DATABASE=$CLICKHOUSE_DATABASE
          EOF
      - name: Diagnose decision_fusion import path
        env:
          PYTHONPATH: .
        run: |
          set -euxo pipefail
          python --version
          python - <<'PY'
          from pathlib import Path
          import ast
          import hashlib
          import importlib.util
          import sys
          path = Path("aitos/kernel/decision_fusion.py").resolve()
          data = path.read_bytes()
          source = data.decode("utf-8")
          print("PYTHON:", sys.executable)
          print("PATH:", path)
          print("BYTES:", len(data))
          print("SHA256:", hashlib.sha256(data).hexdigest())
          print("LINE_COUNT:", len(source.splitlines()))
          ast.parse(source, filename=str(path))
          print("AST_PARSE: OK")
          module_name = "decision_fusion_direct"
          spec = importlib.util.spec_from_file_location(module_name, path)
          if spec is None or spec.loader is None:
              raise RuntimeError("Could not construct import spec")
          module = importlib.util.module_from_spec(spec)
          sys.modules[module_name] = module
          try:
              spec.loader.exec_module(module)
          finally:
              sys.modules.pop(module_name, None)
          print("DIRECT_IMPORT: OK")
          print("MODULE_FILE:", getattr(module, "__file__", None))
          print("ENGINE:", module.DecisionFusionEngine)
          PY
      - name: Run tests with pytest
        env:
          PYTHONPATH: .
        run: pytest --cov=. --cov-report=xml --cov-report=html --junitxml=junit/test-results-${{ matrix.python-version }}.xml -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - name: Upload test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml

  security:
    runs-on: ubuntu-latest
    name: Security Scan
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      - name: Run Bandit security scan
        run: bandit -r . -f json -o bandit-report.json
        continue-on-error: true
      - name: Check dependencies for vulnerabilities
        run: safety check --json
        continue-on-error: true
      - name: Upload security reports
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: security-reports
          path: bandit-report.json

  docker-validate:
    runs-on: ubuntu-latest
    name: Docker & Compose Validation
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Prepare safe CI environment
        run: |
          set -euo pipefail
          cp .env.example .env
      - name: Validate Docker Compose configuration
        run: docker compose config >/dev/null
      - name: Lowercase repository name
        id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          tags: ${{ steps.repo.outputs.repo }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  results:
    runs-on: ubuntu-latest
    name: CI Results
    needs: [lint, test, security, docker-validate]
    if: always()
    steps:
      - name: Determine CI status
        id: ci-status
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.test.result }}" == "failure" ] || \
             [ "${{ needs.security.result }}" == "failure" ] || \
             [ "${{ needs.docker-validate.result }}" == "failure" ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          fi
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${{ steps.ci-status.outputs.emoji }} **CI Pipeline: ${{ steps.ci-status.outputs.status }}**\n\n| Step | Status |\n|------|--------|\n| Linting | ${{ needs.lint.result }} |\n| Tests | ${{ needs.test.result }} |\n| Security | ${{ needs.security.result }} |\n| Docker | ${{ needs.docker-validate.result }} |`
            })
